$schema: https://json-schema.org/draft/2020-12/schema
$id: https://opendataproducts.org/odpc-v1.1/schema/odpc.yaml
title: ODPC 1.1 Catalog Schema
description: Catalog schema for ODPC 1.1. ProductReference may point to an ODPC AIProduct profile or another product standard.
type: object
additionalProperties: false
required: [schema, version, kind, catalog]
properties:
  schema: {const: https://opendataproducts.org/odpc-v1.1/schema/odpc.yaml}
  version: {const: "1.1"}
  kind: {const: Catalog}
  catalog: {$ref: "#/$defs/Catalog"}
$defs:
  LanguageString:
    type: object
    minProperties: 1
    required: [en]
    properties: {en: {type: string, minLength: 1}}
    patternProperties: {"^[a-z]{2,3}(-[A-Za-z0-9]+)*$": {type: string, minLength: 1}}
    additionalProperties: false
  Owner:
    type: object
    additionalProperties: false
    properties:
      organization: {type: string, minLength: 1}
      team: {type: string, minLength: 1}
      role: {type: string, minLength: 1}
    patternProperties: {"^x-": {}}
  Reference: {type: string, minLength: 1}
  ProductModel:
    type: object
    additionalProperties: false
    required: [standard, version, format, "$ref"]
    properties:
      standard: {type: string, minLength: 1}
      version: {type: string, minLength: 1}
      profile: {type: string, minLength: 1}
      format: {type: string, enum: [yaml, json, html, markdown, api, other]}
      schema: {$ref: "#/$defs/Reference"}
      "$ref": {$ref: "#/$defs/Reference"}
    patternProperties: {"^x-": {}}
  ProductReference:
    type: object
    additionalProperties: false
    required: [kind, id, productID, productVersion, name, description, productModel]
    properties:
      kind: {const: productReference}
      id: {type: string, minLength: 1}
      productID: {type: string, minLength: 1}
      productVersion: {type: string, minLength: 1}
      name: {$ref: "#/$defs/LanguageString"}
      description: {$ref: "#/$defs/LanguageString"}
      valueProposition: {$ref: "#/$defs/LanguageString"}
      productCategory: {type: string, enum: [data_product, ai_product]}
      visibility: {type: string, enum: [public, internal, restricted, private]}
      status: {type: string}
      type: {type: string}
      domains: {type: array, items: {type: string}}
      categories: {type: array, items: {type: string}}
      standards: {type: array, items: {type: string}}
      tags: {type: array, items: {type: string}}
      portfolioPriority: {type: string, enum: [low, medium, high, critical]}
      governanceProfile: {type: string}
      owner: {$ref: "#/$defs/Owner"}
      productModel: {$ref: "#/$defs/ProductModel"}
      logoURL: {type: string}
      outputFileFormats: {type: array, items: {type: string}}
    patternProperties: {"^x-": {}}
    allOf:
      - if:
          properties: {productCategory: {const: ai_product}}
          required: [productCategory]
        then:
          properties:
            productModel:
              allOf:
                - {$ref: "#/$defs/ProductModel"}
                - type: object
                  required: [schema, profile]
                  properties:
                    standard: {const: ODPC}
                    version: {const: "1.1"}
                    profile: {const: AIProduct}
                    schema: {type: string, minLength: 1}
  LegacyNode:
    type: object
    additionalProperties: true
    required: [kind, id, name, description]
    properties:
      kind:
        enum: [useCase, businessObjective, signal, domain, dataset, api, policy, workflow, agent, capability, strategicOpportunity]
      id: {type: string, minLength: 1}
      name: {$ref: "#/$defs/LanguageString"}
      description: {$ref: "#/$defs/LanguageString"}
  AIProductNode:
    type: object
    additionalProperties: false
    required: [kind, id, productID, productVersion, name, description, purpose, owner, productType, governance, evaluation]
    properties:
      kind: {const: aiProduct}
      id: {type: string, minLength: 1}
      productID: {type: string, minLength: 1}
      productVersion: {type: string, minLength: 1}
      name: {$ref: "#/$defs/LanguageString"}
      description: {$ref: "#/$defs/LanguageString"}
      purpose: {$ref: "#/$defs/LanguageString"}
      valueProposition: {$ref: "#/$defs/LanguageString"}
      owner: {$ref: "#/$defs/Owner"}
      productType: {enum: [predictive, generative, rag, agentic, hybrid, other]}
      capabilities: {type: array, items: {type: object}}
      governance: {type: object}
      evaluation: {type: array, minItems: 1, items: {type: object}}
      operations: {type: object}
      implementationReferences: {type: array, items: {type: object}}
    patternProperties: {"^x-": {}}
  Node:
    type: object
    additionalProperties: false
    required: [node]
    properties:
      node:
        oneOf:
          - {$ref: "#/$defs/ProductReference"}
          - {$ref: "#/$defs/AIProductNode"}
          - {$ref: "#/$defs/LegacyNode"}
  CatalogMeta:
    type: object
    additionalProperties: false
    required: [id, name, description]
    properties:
      id: {type: string, minLength: 1}
      name: {$ref: "#/$defs/LanguageString"}
      description: {$ref: "#/$defs/LanguageString"}
      owner: {$ref: "#/$defs/Owner"}
      version: {type: string}
      status: {type: string}
      tags: {type: array, items: {type: string}}
    patternProperties: {"^x-": {}}
  Catalog:
    type: object
    additionalProperties: false
    required: [metadata, nodes]
    properties:
      metadata: {$ref: "#/$defs/CatalogMeta"}
      nodes: {type: array, items: {$ref: "#/$defs/Node"}}
    patternProperties: {"^x-": {}}
