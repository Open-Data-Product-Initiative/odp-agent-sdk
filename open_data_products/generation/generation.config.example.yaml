# Example generation config. Safe to commit: secrets are referenced by
# environment variable name, never stored here.
#
# The top-level keys below are generation defaults. `provider` selects the
# default entry from the `providers` map, while `model`, `input`, and `output`
# provide default runtime values. A provider-specific `model` overrides the
# top-level model when that provider is selected. CLI flags such as
# `--provider`, `--model`, `--input`, and `--output` override this file for one
# run.

provider: ollama
model: qwen2.5
input: open_data_products/generation/source_docs/
output: open_data_products/generation/fragments/

# To make Claude the default instead, set `provider: claude`. The selected
# provider entry below supplies the Claude model and Anthropic API settings.
# For any selected online provider, export the API key environment variable
# named by that provider's `apiKeyEnv` before running generation.
#
# provider: claude
# input: open_data_products/generation/source_docs/
# output: open_data_products/generation/fragments/
#
# export ANTHROPIC_API_KEY="..."

providers:
  ollama:
    type: ollama
    baseUrl: http://localhost:11434

  openai:
    type: openai
    model: gpt-4.1-mini
    baseUrl: https://api.openai.com/v1
    # Export OPENAI_API_KEY before selecting this provider.
    apiKeyEnv: OPENAI_API_KEY

  # OpenAI-compatible Responses API providers. Select one with
  # `--provider openrouter` or `--provider groq`, and choose a model supported
  # by that provider.
  openrouter:
    type: openai
    model: openai/gpt-4.1-mini
    baseUrl: https://openrouter.ai/api/v1
    # Export OPENROUTER_API_KEY before selecting this provider.
    apiKeyEnv: OPENROUTER_API_KEY

  groq:
    type: openai
    model: openai/gpt-oss-120b
    baseUrl: https://api.groq.com/openai/v1
    # Export GROQ_API_KEY before selecting this provider.
    apiKeyEnv: GROQ_API_KEY

  # Anthropic Claude uses its own Messages API client.
  claude:
    type: anthropic
    model: claude-sonnet-4-5
    baseUrl: https://api.anthropic.com/v1
    # Export ANTHROPIC_API_KEY before selecting this provider.
    apiKeyEnv: ANTHROPIC_API_KEY
    version: "2023-06-01"
    maxTokens: 4096

  # Providers with different auth or request formats should get a dedicated
  # SDK client before being enabled here, for example Azure OpenAI, Google
  # Gemini, Mistral, Cohere, and Bedrock. 
  # 
  # Contributions for new provider clients are welcome.
