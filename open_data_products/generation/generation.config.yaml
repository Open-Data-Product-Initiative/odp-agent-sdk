# Generation config for `open-data-products generate` in the Open Data Product SDK.
# Project: https://opendataproducts.org
#
# Use this file directly, or copy it into another project, when you want to
# choose the LLM provider, model, input folder, and output folder from a config
# file. Safe to commit: secrets are referenced by environment variable name,
# never stored here.
#
# The top-level keys below are generation defaults. `provider` selects the
# default entry from the `providers` map, while `model`, `input`, and `output`
# provide default runtime values. Provider-specific `model` values are examples
# only; replace them with any model name your selected provider exposes. CLI
# flags such as `--provider`, `--model`, `--input`, and `--output` override this
# file for one run.

provider: ollama
model: qwen2.5
input: open_data_products/generation/source_docs/
output: open_data_products/generation/fragments/

# To make Claude the default instead, set `provider: claude`. The selected
# provider entry below supplies the Claude model and Anthropic API settings.
# For any selected online provider, export the API key environment variable
# named by that provider's `apiKeyEnv` before running generation.
#
# provider: claude
# input: open_data_products/generation/source_docs/
# output: open_data_products/generation/fragments/
#
# export ANTHROPIC_API_KEY="..."

providers:
  ollama:
    type: ollama
    # Replace with any model available from your Ollama instance.
    model: qwen2.5
    baseUrl: http://localhost:11434

  # Local Ollama model presets for Apple Silicon and workstation use. Select
  # one with `--provider <name>` after pulling the matching model with Ollama.
  # Sweet spot: light, fast, and practical for structured ODPS-family YAML.
  ollama-gemma3n:
    type: ollama
    model: gemma3n:e4b
    baseUrl: http://localhost:11434

  ollama-qwen25:
    type: ollama
    model: qwen2.5:7b
    baseUrl: http://localhost:11434

  ollama-qwen3:
    type: ollama
    model: qwen3:8b
    baseUrl: http://localhost:11434

  ollama-llama:
    type: ollama
    model: llama3.1:8b
    baseUrl: http://localhost:11434

  ollama-mistral:
    type: ollama
    model: mistral:7b
    baseUrl: http://localhost:11434

  ollama-phi:
    type: ollama
    model: phi4-mini
    baseUrl: http://localhost:11434

  # Realistic but slower on smaller local machines.
  ollama-qwen25-14b:
    type: ollama
    model: qwen2.5:14b
    baseUrl: http://localhost:11434

  ollama-qwen3-14b:
    type: ollama
    model: qwen3:14b
    baseUrl: http://localhost:11434

  ollama-deepseek14b:
    type: ollama
    model: deepseek-r1:14b
    baseUrl: http://localhost:11434

  ollama-large-q4:
    type: ollama
    model: qwen3:32b
    baseUrl: http://localhost:11434

  # Local OpenAI-compatible chat servers such as LM Studio, vLLM, NVIDIA NIM,
  # llama.cpp server, and LocalAI usually expose /v1/chat/completions. Replace
  # `model` with the model name loaded in that server.
  lmstudio:
    type: openai-chat
    model: local-model
    baseUrl: http://localhost:1234/v1

  # LM Studio / MLX presets for Google's lightweight Gemma 4 family.
  lmstudio-gemma4-e4b:
    type: openai-chat
    model: google/gemma-4-e4b
    baseUrl: http://localhost:1234/v1

  lmstudio-gemma4-12b:
    type: openai-chat
    model: google/gemma-4-12b
    baseUrl: http://localhost:1234/v1

  vllm:
    type: openai-chat
    model: local-model
    baseUrl: http://localhost:8000/v1

  # NVIDIA NIM for LLM containers expose OpenAI-compatible chat completions on
  # the NIM server port. Replace `model` with the model served by the container.
  nvidia-nim:
    type: openai-chat
    model: local-model
    baseUrl: http://localhost:8000/v1

  # Embedded llama.cpp runs GGUF models in-process through the optional
  # llama-cpp-python integration. Install with:
  #   pip install "open-data-products[llama-cpp]"
  # Replace modelPath with a local GGUF file before selecting this provider.
  llamacpp-embedded:
    type: llama-cpp
    model: local-gguf
    modelPath: models/qwen2.5-7b-instruct-q4_k_m.gguf
    contextWindow: 8192
    gpuLayers: -1

  openai:
    type: openai
    model: gpt-4.1-mini
    baseUrl: https://api.openai.com/v1
    # Export OPENAI_API_KEY before selecting this provider.
    # Example: export OPENAI_API_KEY="..."
    apiKeyEnv: OPENAI_API_KEY

  # OpenAI-compatible Responses API providers. Select one with
  # `--provider openrouter` or `--provider groq`, and choose a model supported
  # by that provider.
  openrouter:
    type: openai
    model: openai/gpt-4.1-mini
    baseUrl: https://openrouter.ai/api/v1
    # Export OPENROUTER_API_KEY before selecting this provider.
    # Example: export OPENROUTER_API_KEY="..."
    apiKeyEnv: OPENROUTER_API_KEY

  groq:
    type: openai
    model: openai/gpt-oss-120b
    baseUrl: https://api.groq.com/openai/v1
    # Export GROQ_API_KEY before selecting this provider.
    # Example: export GROQ_API_KEY="..."
    apiKeyEnv: GROQ_API_KEY

  # Together AI exposes OpenAI-compatible chat completions. Select this
  # provider with `--provider together`, and choose any chat model supported by
  # Together.
  together:
    type: openai-chat
    model: meta-llama/Llama-3.3-70B-Instruct-Turbo
    baseUrl: https://api.together.ai/v1
    # Export TOGETHER_API_KEY before selecting this provider.
    # Example: export TOGETHER_API_KEY="..."
    apiKeyEnv: TOGETHER_API_KEY

  # Cerebras Inference exposes OpenAI-compatible chat completions. Select this
  # provider with `--provider cerebras`, and choose any model supported by
  # Cerebras.
  cerebras:
    type: openai-chat
    model: gpt-oss-120b
    baseUrl: https://api.cerebras.ai/v1
    # Export CEREBRAS_API_KEY before selecting this provider.
    # Example: export CEREBRAS_API_KEY="..."
    apiKeyEnv: CEREBRAS_API_KEY

  # SambaNova exposes OpenAI-compatible chat completions. Select this provider
  # with `--provider sambanova`, and choose any model supported by SambaCloud or
  # your SambaStack deployment.
  sambanova:
    type: openai-chat
    model: Meta-Llama-3.3-70B-Instruct
    baseUrl: https://api.sambanova.ai/v1
    # Export SAMBANOVA_API_KEY before selecting this provider.
    # Example: export SAMBANOVA_API_KEY="..."
    apiKeyEnv: SAMBANOVA_API_KEY

  # Mistral AI exposes OpenAI-compatible chat completions. Select this provider
  # with `--provider mistral`, and choose any model supported by Mistral.
  mistral:
    type: openai-chat
    model: mistral-large-latest
    baseUrl: https://api.mistral.ai/v1
    # Export MISTRAL_API_KEY before selecting this provider.
    # Example: export MISTRAL_API_KEY="..."
    apiKeyEnv: MISTRAL_API_KEY

  # Gemini exposes an OpenAI-compatible chat completions layer. Select this
  # provider with `--provider gemini`, and choose any compatible Gemini model.
  gemini:
    type: openai-chat
    model: gemini-3.5-flash
    baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
    # Export GEMINI_API_KEY before selecting this provider.
    # Example: export GEMINI_API_KEY="..."
    apiKeyEnv: GEMINI_API_KEY

  # xAI exposes OpenAI-compatible chat completions for Grok models. Select this
  # provider with `--provider xai`, and choose any model supported by xAI.
  xai:
    type: openai-chat
    model: grok-4.3
    baseUrl: https://api.x.ai/v1
    # Export XAI_API_KEY before selecting this provider.
    # Example: export XAI_API_KEY="..."
    apiKeyEnv: XAI_API_KEY

  # Anthropic Claude uses its own Messages API client.
  claude:
    type: anthropic
    model: claude-sonnet-4-5
    baseUrl: https://api.anthropic.com/v1
    # Export ANTHROPIC_API_KEY before selecting this provider.
    # Example: export ANTHROPIC_API_KEY="..."
    apiKeyEnv: ANTHROPIC_API_KEY
    version: "2023-06-01"
    maxTokens: 8192

  # Providers with different auth or request formats should get a dedicated
  # SDK client before being enabled here, for example Azure OpenAI, Google
  # Gemini, Mistral, Cohere, and Bedrock.
  #
  # Contributions for new provider clients are welcome.
