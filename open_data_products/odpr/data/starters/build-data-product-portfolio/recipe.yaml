schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-SDK-PORTFOLIO-BUILD
    name:
      en: Build Data Product Portfolio
    description:
      en: Build a static portfolio workspace from source lanes.
    tags:
      - portfolio
      - starter
  version: "1.0.0"
  type: agent
  steps:
    - id: build-portfolio
      command: portfolio.build
      with:
        products:
          - inputs/products
        workspace: outputs/portfolio
