schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: RecipeCatalog
recipeCatalog:
  metadata:
    id: RCP-SDK-STARTERS
    name:
      en: Open Data Products SDK Starter Recipes
    description:
      en: Built-in ODPR starter recipes for Open Data Products SDK workflows.
  version: "1.0.0"
  groups:
    - id: starters
      name:
        en: Starter Recipes
      description:
        en: Recipes intended for workspace initialization and first-run workflows.
  recipes:
    - path: build-data-product-portfolio/recipe.yaml
      id: RCP-SDK-PORTFOLIO-BUILD
      version: "1.0.0"
      type: agent
      name:
        en: Build Data Product Portfolio
      description:
        en: Build a static portfolio workspace from source lanes.
      groupRef: starters
      tags:
        - portfolio
        - starter
      executionMode: local
      contextFormat: yaml
      commands:
        - portfolio.build
    - path: source-to-product-fragments/recipe.yaml
      id: RCP-SDK-SOURCE-FRAGMENTS
      version: "1.0.0"
      type: agent
      name:
        en: Source Documents to Product Fragments
      description:
        en: Generate ODPC product reference fragments from source documents.
      groupRef: starters
      tags:
        - generation
        - starter
      executionMode: hybrid
      contextFormat: yaml
      requiresReview: true
      commands:
        - generate
    - path: fragments-to-odpc-catalog/recipe.yaml
      id: RCP-SDK-FRAGMENTS-CATALOG
      version: "1.0.0"
      type: agent
      name:
        en: Fragments to ODPC Catalog
      description:
        en: Assemble ODPC fragments into a catalog artifact.
      groupRef: starters
      tags:
        - catalog
        - starter
      executionMode: local
      contextFormat: yaml
      commands:
        - odpc.build
    - path: fragments-to-odpg-graph/recipe.yaml
      id: RCP-SDK-FRAGMENTS-GRAPH
      version: "1.0.0"
      type: agent
      name:
        en: Fragments to ODPG Graph
      description:
        en: Generate an ODPG graph from catalog fragments.
      groupRef: starters
      tags:
        - graph
        - starter
      executionMode: hybrid
      contextFormat: yaml
      requiresReview: true
      commands:
        - odpg.build
    - path: generate-agent-context/recipe.yaml
      id: RCP-SDK-AGENT-CONTEXT
      version: "1.0.0"
      type: agent
      name:
        en: Generate Agent Context
      description:
        en: Render compact graph context for agent workflows.
      groupRef: starters
      tags:
        - graph
        - context
        - starter
      executionMode: local
      contextFormat: gcf
      commands:
        - odpg.render
