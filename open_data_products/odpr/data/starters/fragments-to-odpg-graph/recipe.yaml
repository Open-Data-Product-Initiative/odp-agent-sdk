schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-SDK-FRAGMENTS-GRAPH
    name:
      en: Fragments to ODPG Graph
    description:
      en: Generate an ODPG graph from catalog fragments.
    tags:
      - graph
      - starter
  version: "1.0.0"
  type: agent
  execution:
    providerRef: default
  steps:
    - id: build-graph
      command: odpg.build
      with:
        input: inputs/fragments
        output: outputs/graph.yaml
