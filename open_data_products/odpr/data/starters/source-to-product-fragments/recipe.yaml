schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-SDK-SOURCE-FRAGMENTS
    name:
      en: Source Documents to Product Fragments
    description:
      en: Generate ODPC product reference fragments from source documents.
    tags:
      - generation
      - starter
  version: "1.0.0"
  type: agent
  execution:
    providerRef: default
  steps:
    - id: generate-product-fragments
      command: generate
      with:
        input: inputs/source-docs
        kind: product-reference
        output: outputs/fragments
