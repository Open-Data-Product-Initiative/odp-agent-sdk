schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-SDK-FRAGMENTS-CATALOG
    name:
      en: Fragments to ODPC Catalog
    description:
      en: Assemble ODPC fragments into a catalog artifact.
    tags:
      - catalog
      - starter
  version: "1.0.0"
  type: agent
  steps:
    - id: build-catalog
      command: odpc.build
      with:
        input: inputs/fragments
        output: outputs/catalog.yaml
