schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-SDK-AGENT-CONTEXT
    name:
      en: Generate Agent Context
    description:
      en: Render compact graph context for agent workflows.
    tags:
      - graph
      - context
      - starter
  version: "1.0.0"
  type: agent
  steps:
    - id: render-graph-context
      command: odpg.render
      with:
        graph: inputs/graph.yaml
        output: outputs/graph.html
