name: Test and Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test and packaging dependencies
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Build and inspect the distribution
        run: |
          python -m build --quiet
          python -m twine check dist/*

      - name: Smoke test the installed wheel
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          python -m venv /tmp/open-data-products-wheel
          /tmp/open-data-products-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/open-data-products-wheel/bin/python - <<'PY'
          import os
          from pathlib import Path

          from open_data_products.agent import validate_document
          from open_data_products.dcat import discover_dcat_catalog
          from open_data_products.dprod import export_odps_to_dprod
          from open_data_products._io import load_mapping
          from open_data_products.profiles import (
              profile_ref,
              transform_profile,
              validate_profile,
              validate_vocabulary_release,
          )
          from open_data_products.resources import get_resource

          fixture = Path(os.environ["WORKSPACE"]) / "tests/fixtures/odps_v42_profiles.yaml"
          assert validate_document(fixture).valid
          assert Path(get_resource("odps.v4.2.schema.yaml").path).is_file()
          assert Path(get_resource("odpv.v1_1.vocabulary").path).is_file()
          assert Path(get_resource("odpv.v1_1.profile-schema").path).is_file()
          assert validate_vocabulary_release("1.1.0")["valid"]
          assert validate_profile(profile_ref("ODPV-DCAT-3", "0.1.0")).valid
          dcat = transform_profile(
              profile_ref("ODPV-DCAT-3", "0.1.0"),
              "odpvToExternal",
              {
                  "objects": [{"id": "dataset", "type": "Dataset"}],
                  "relationships": [],
              },
              allow_draft=True,
          )
          assert dcat["status"] == "executed"
          dprod_export = export_odps_to_dprod(load_mapping(fixture))
          assert dprod_export.validation.conforms
          dcat_catalog = Path("dcat-wheel-smoke.ttl")
          dcat_catalog.write_text(
              """@prefix dcat: <http://www.w3.org/ns/dcat#> .
          @prefix dct: <http://purl.org/dc/terms/> .
          <https://wheel.example.test/catalog> a dcat:Catalog ;
            dcat:dataset <https://wheel.example.test/datasets/air> .
          <https://wheel.example.test/datasets/air> a dcat:Dataset ;
            dct:title "Air quality" .
          """.strip(),
              encoding="utf-8",
          )
          dcat_inventory = discover_dcat_catalog(str(dcat_catalog))
          assert any(
              resource.id == "https://wheel.example.test/datasets/air"
              for resource in dcat_inventory.resources
          )
          PY

      - name: Set up Java for independent DPROD SHACL validation
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cross-check exported DPROD RDF with Apache Jena SHACL
        env:
          JENA_VERSION: 6.2.0
          JENA_SHA512: 2b467d2ff940c207aea935e012ecbb0f0ab3e6bf59b3fc4b3fbc6cf9cea11f1428e97882ec078a5ffc57e114e0f5c88ea98c4575e687cc1dd232f99324b7b2a2
          WORKSPACE: ${{ github.workspace }}
          DPROD_EXPORT: ${{ runner.temp }}/dprod-export.ttl
        run: |
          cd "${RUNNER_TEMP}"
          curl -fsSLO "https://downloads.apache.org/jena/binaries/apache-jena-${JENA_VERSION}.tar.gz"
          echo "${JENA_SHA512}  apache-jena-${JENA_VERSION}.tar.gz" | sha512sum -c -
          tar -xzf "apache-jena-${JENA_VERSION}.tar.gz"
          python - <<'PY'
          import os
          from pathlib import Path

          from open_data_products._io import load_mapping
          from open_data_products.dprod import export_odps_to_dprod

          fixture = Path(os.environ["WORKSPACE"]) / "tests/fixtures/odps_v42_profiles.yaml"
          result = export_odps_to_dprod(load_mapping(fixture))
          assert result.validation.conforms
          Path(os.environ["DPROD_EXPORT"]).write_text(result.turtle, encoding="utf-8")
          PY
          "${RUNNER_TEMP}/apache-jena-${JENA_VERSION}/bin/shacl" validate \
            --shapes "${WORKSPACE}/open_data_products/dprod/data/dprod-shapes.ttl" \
            --data "${DPROD_EXPORT}"

      - name: Run the test suite
        run: pytest -q
