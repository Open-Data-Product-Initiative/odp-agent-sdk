name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish, for example 0.1.0"
        required: true
        default: "0.1.0"
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install build backend
      run: python -m pip install --upgrade build

    - name: Verify package version matches release
      env:
        DISPATCH_VERSION: ${{ github.event.inputs.version }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        EXPECTED_VERSION="${DISPATCH_VERSION:-${RELEASE_TAG#v}}"
        PACKAGE_VERSION="$(python -c 'import open_data_products; print(open_data_products.__version__)')"
        if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
          echo "Package version $PACKAGE_VERSION does not match expected $EXPECTED_VERSION"
          exit 1
        fi

    - name: Build distribution
      run: python -m build

    - name: Upload distribution artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
