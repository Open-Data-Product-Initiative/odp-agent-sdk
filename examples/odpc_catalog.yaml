schema: https://opendataproducts.org/odpc-v1.0/schema/odpc.yaml
version: '1.0'
kind: Catalog
catalog:
  metadata:
    id: CAT-EXAMPLE
    name:
      en: Example ODPC Catalog
    description:
      en: Sample catalog built from ODPC fragments and an ODPS product file.
  productReferences:
  - id: customer-analytics-product
    productID: customer-analytics-product
    productVersion: '4.1'
    name:
      en: Customer Analytics Product
    description:
      en: Customer analytics product referenced by the sample catalog.
    productModel:
      standard: ODPS
      version: '4.1'
      format: yaml
      $ref: customer_product.yaml
    visibility: internal
    status: production
    type: dataset
  useCases:
  - id: UC-CUSTOMER-RETENTION
    name:
      en: Customer Retention
    description:
      en: Improve retention decisions with trusted customer analytics.
    status: active
    priority: high
