schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-EXAMPLE-ONLINE-FRAGMENTS
    name:
      en: Online LLM Fragment Generation
    description:
      en: Generate signal fragments with a hosted LLM provider.
    tags:
      - example
      - hosted-llm
      - generation
  version: "1.0.0"
  type: dev
  review:
    required: true
  execution:
    providerRef: claude
  steps:
    - id: generate-signal
      command: generate
      providerRef: claude
      model: claude-sonnet-4-5
      with:
        input: inputs/source-documents/
        kind: signal
        output: outputs-example/fragments/
