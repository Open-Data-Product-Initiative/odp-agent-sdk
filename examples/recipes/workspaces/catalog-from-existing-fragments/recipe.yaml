schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-EXAMPLE-CATALOG-FROM-FRAGMENTS
    name:
      en: Catalog From Existing Fragments
    description:
      en: Assemble an ODPC catalog from existing fragments.
    tags:
      - example
      - odpc
      - deterministic
  version: "1.0.0"
  type: ci
  steps:
    - id: build-catalog
      command: odpc.build
      with:
        input: inputs/fragments/
        output: outputs-example/catalog.yaml
        html: outputs-example/catalog.html
        toon: outputs-example/catalog.toon
        gcf: outputs-example/catalog.gcf
