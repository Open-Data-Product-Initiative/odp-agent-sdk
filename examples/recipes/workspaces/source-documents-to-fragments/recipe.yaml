schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-EXAMPLE-SOURCE-FRAGMENTS
    name:
      en: Source Documents To Product Fragments
    description:
      en: Generate ODPC product reference fragments from source documents.
    tags:
      - example
      - odpc
      - generation
  version: "1.0.0"
  type: dev
  review:
    required: true
  execution:
    providerRef: claude
  steps:
    - id: generate-product-fragments
      command: generate
      providerRef: claude
      model: claude-sonnet-4-5
      with:
        input: inputs/source-documents/
        kind: product-reference
        output: outputs-example/fragments/
