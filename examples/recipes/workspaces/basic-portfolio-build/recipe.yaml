schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-EXAMPLE-BASIC-PORTFOLIO
    name:
      en: Basic Portfolio Build
    description:
      en: Build a portfolio workspace from small source lane inputs.
    tags:
      - example
      - portfolio
  version: "1.0.0"
  type: dev
  review:
    required: true
  execution:
    providerRef: claude
  steps:
    - id: build-portfolio
      command: portfolio.build
      providerRef: claude
      model: claude-sonnet-4-5
      with:
        output: outputs-example/portfolio/
        objectives:
          - inputs/objectives/
        useCases:
          - inputs/use-cases/
        signals:
          - inputs/signals/
        products:
          - inputs/products/
