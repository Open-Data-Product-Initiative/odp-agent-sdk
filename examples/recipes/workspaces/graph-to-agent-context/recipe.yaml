schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-EXAMPLE-GRAPH-CONTEXT
    name:
      en: Graph To Agent Context
    description:
      en: Render compact context from an existing ODPG graph.
    tags:
      - example
      - odpg
      - context
  version: "1.0.0"
  type: ci
  steps:
    - id: render-context
      command: odpg.render
      with:
        graph: inputs/graph.yaml
        output: outputs-example/graph.gcf
