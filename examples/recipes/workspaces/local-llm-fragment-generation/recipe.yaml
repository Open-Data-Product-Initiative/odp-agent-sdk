schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-EXAMPLE-LOCAL-FRAGMENTS
    name:
      en: Local LLM Fragment Generation
    description:
      en: Generate signal fragments with a local LLM provider.
    tags:
      - example
      - local-llm
      - generation
  version: "1.0.0"
  type: dev
  review:
    required: true
  execution:
    providerRef: ollama
  steps:
    - id: generate-signal-local
      command: generate
      providerRef: ollama
      model: qwen2.5
      with:
        input: inputs/source-documents/
        kind: signal
        output: outputs-example/fragments/
