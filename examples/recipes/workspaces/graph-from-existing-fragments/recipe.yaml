schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-EXAMPLE-GRAPH-FROM-FRAGMENTS
    name:
      en: Graph From Existing Fragments
    description:
      en: Generate an ODPG graph from ODPC fragments.
    tags:
      - example
      - odpg
      - graph
  version: "1.0.0"
  type: dev
  review:
    required: true
  execution:
    providerRef: claude
  steps:
    - id: build-graph
      command: odpg.build
      providerRef: claude
      model: claude-sonnet-4-5
      with:
        input: inputs/fragments/
        output: outputs-example/graph.yaml
        toon: outputs-example/graph.toon
        gcf: outputs-example/graph.gcf
        id: example-graph
        name: Example Graph
