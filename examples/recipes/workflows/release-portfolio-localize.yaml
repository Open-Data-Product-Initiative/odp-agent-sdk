schema: https://opendataproducts.org/odpr-v1.0/schema/odpr.yaml
version: "1.0"
kind: Recipe
recipe:
  metadata:
    id: RCP-PORTFOLIO-LOCALIZE-001
    name:
      en: Release Portfolio Localization
    description:
      en: Plan release localization for the example portfolio. Dry-run is supported; execute blocks LLM-backed steps in the current SDK.
    tags:
      - portfolio
      - release
      - localization
  version: "1.0.0"
  type: release
  review:
    required: true
  execution:
    providerRef: claude
  steps:
    - id: localize
      command: portfolio.localize
      providerRef: claude
      model: claude-sonnet-4-5
      with:
        workspace: workspace/
        languages:
          - fi
          - sv
