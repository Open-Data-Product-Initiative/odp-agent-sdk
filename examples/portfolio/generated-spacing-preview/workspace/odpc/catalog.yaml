schema: https://opendataproducts.org/odpc-v1.0/schema/odpc.yaml
version: '1.0'
kind: Catalog
catalog:
  metadata:
    id: CAT-PORTFOLIO
    name:
      en: Spacing Preview Portfolio
    description:
      en: Portfolio synced from YAML artifacts.
  businessObjectives:
  - id: OBJ-RETENTION
    name:
      en: Improve Retention
    description:
      en: Reduce customer churn.
    status: active
    priority: high
  useCases:
  - id: UC-RETENTION
    name:
      en: Retention Workflow
    description:
      en: Help teams intervene before churn.
    status: active
    priority: high
  signals:
  - id: churn-signal
    name:
      en: Churn Signal
    description:
      en: Market signal for retention risk.
    type: market
    confidence: high
    source:
      origin: internal
      method: market note
    observedAt: 2026-05-20T00:00:00Z
  productReferences:
  - id: PR-CUSTOMER
    productID: customer-product
    productVersion: '4.1'
    name:
      en: Customer Product
    description:
      en: Customer analytics product.
    status: production
    visibility: internal
    type: dataset
    productModel:
      standard: ODPS
      version: '4.1'
      format: yaml
      $ref: ../odps/products/customer-product.yaml
